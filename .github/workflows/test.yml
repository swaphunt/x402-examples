# Tests the MCP server against a local fake API (tests/fake_swaphunt.py): no network to SwapHunt, no
# money. Also builds the package with uv and runs the built wheel as uvx would. Publishes nothing;
# publishing is publish-mcp.yml, on an mcp-v* tag only.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -q

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # oldest supported and newest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - name: Run the built wheel with uv tool run, as uvx runs it
        run: uv tool run --isolated --python ${{ matrix.python }} --from dist/swaphunt_mcp-*.whl swaphunt-mcp --version
