# Secret scanning with the gitleaks CLI (no gitleaks-action, so no license key is needed).
# Scans only the commits a push or pull request adds; the full history was scanned once by hand.
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # New branch or force push: scan commits not reachable from any other branch.
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
              | grep -vx -e "refs/remotes/origin/${REF_NAME}" -e "refs/remotes/origin/HEAD" || true)
            if [ -n "$others" ]; then
              log_opts="${PUSH_AFTER} --not ${others//$'\n'/ }"
            else
              log_opts="-1 ${PUSH_AFTER}"
            fi
          fi
          echo "Scanning: git log ${log_opts}"
          # --redact keeps secret values out of the job log.
          "$RUNNER_TEMP/gitleaks" git . --log-opts="${log_opts}" --redact --no-banner --verbose
