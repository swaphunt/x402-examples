# AI security review of pull requests (anthropics/claude-code-security-review).
# Needs the repository secret ANTHROPIC_API_KEY. Without it (also for Dependabot and
# fork PRs, which get no secrets) the review job is skipped, not failed.
# The action is not hardened against prompt injection: only trusted PRs should reach it.
name: claude-security-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude security review."
          fi

  review:
    needs: check-secret
    if: needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # post review comments on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda  # main @ 2026-02-11 (no release tags)
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
